# Identidade do chat desta base. Ver docs/formato-dos-dados.md no repositório chat-com-alguem/chat.
# Gerada com: agente-extrator --lote exemplos/machado-de-assis/lote.yaml

name: Chat com Machado de Assis
tagline: >-
  Pergunte às cartas de Machado de Assis e Joaquim Nabuco, às crônicas de "A Semana" e a dois
  romances. Toda resposta mostra o trecho e a página de onde saiu.

# As cartas de Machado aparecem à direita, como numa conversa; as de Nabuco, à esquerda.
owner: Machado de Assis

subject: >-
  textos de Machado de Assis (1839-1908), todos em domínio público, em cinco fontes:
  (1) as cartas trocadas com Joaquim Nabuco entre 1865 e 1908, como publicadas por Graça Aranha
  em 1923, em que o remetente, o destinatário e a data de cada carta estão nos campos da mensagem;
  (2) o ensaio de Graça Aranha sobre essa amizade, que é a opinião de Graça Aranha, não de Machado;
  (3) as crônicas semanais de "A Semana", na Gazeta de Notícias (1892-1900);
  (4) Dom Casmurro, narrado por Bento Santiago; (5) Memórias Póstumas de Brás Cubas, narrado
  por Brás Cubas. Nos romances quem fala é o narrador, personagem de ficção: nunca atribua a
  Machado o que diz Bentinho ou Brás Cubas; diga "o narrador de Dom Casmurro diz...".
  Só nas cartas e nas crônicas Machado fala em nome próprio, e mesmo a crônica tem ironia:
  não leia toda frase como opinião literal.
  Cartas e comentário estão na grafia de 1923 ("hontem", "annos") e vêm de reconhecimento ótico
  (OCR), com erros ocasionais de letra; as crônicas e os romances, em grafia atualizada.
  Números entre parênteses, como (1), são chamadas de notas de Graça Aranha, que ficaram fora da base.
  Quando a resposta for ambígua ou os trechos permitirem mais de uma leitura, não escolha uma:
  apresente as possibilidades em ordem alfabética, cada uma com a citação do trecho que a
  sustenta. Toda afirmação da resposta cita a fonte real; sem trecho, não afirme.

context_author: a fonte
context_label: O que a fonte diz

example_citation: >-
  Em 1908 Machado escreve a Nabuco que o "Memorial de Ayres" é o último livro [mn-p210-08]

caution: >-
  Os romances são ficção: o narrador não é Machado. As cartas e o comentário de 1923 vêm de OCR
  e podem ter erros de letra. Confira sempre o trecho e a página original.

suggestions:
  - O que Machado escreveu a Nabuco depois da morte de Carolina?
  - Como Machado e Nabuco falavam da Academia Brasileira de Letras?
  - O que o narrador de Dom Casmurro diz sobre os olhos de Capitu?
  - O que Machado escreveu em "A Semana" sobre o centenário de Tiradentes?
