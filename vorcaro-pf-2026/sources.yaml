sources:
  - id: pf-ipja-3298613-2026
    title: "Informação de Polícia Judiciária de Análise (IPJ-A) nº 3298613/2026, Polícia Federal"
    short_title: "Relatório da PF sobre o celular de Vorcaro"
    publisher: "Polícia Federal (NADIP/DFIN/CGRC/DICOR); sigilo retirado pelo STF"
    date: 2026-08-27
    description: >
      Relatório de 218 páginas da Polícia Federal com a análise do iPhone de Daniel Vorcaro,
      apreendido na Operação Compliance Zero (18/11/2025). Foi produzido a pedido do ministro
      André Mendonça, do STF, nos autos da Pet 15.556, e entregue em 27/08/2026. O sigilo foi
      retirado por decisão do ministro em 01/09/2026, na Pet 16.662. O relatório reproduz,
      como imagens, conversas de WhatsApp e notas do aplicativo Notas extraídas do aparelho.
