    notes:
      - "As mensagens aparecem no relatório como imagens (prints). O texto deste projeto é uma transcrição e pode ter erros: confira sempre a página original, que o chat mostra ao lado de cada citação."
      - "Nas notas do app Notas, o destinatário não aparece no print. Foi a PF que concluiu, cruzando registros do aparelho, que as notas foram enviadas ao contato salvo como \"Alexandre de Moraes BRASILIA\"."
      - "A própria PF registra que a análise não é exaustiva e foi feita em 72 horas."
      - "Mensagens são elementos de uma investigação em andamento. Não são, por si, prova de crime."
